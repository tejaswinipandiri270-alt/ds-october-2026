
name: NEXUS IT CI

on:
  push:
    branches: [main]
    paths:
      - 'enterprise-it-support-rag/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'enterprise-it-support-rag/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-it-support-rag

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: enterprise-it-support-rag/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
